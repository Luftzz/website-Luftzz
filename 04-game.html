<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Game Memory</title>
<style>
:root{--bg:#fff;--panel:#f5f5f7;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.1);--accent:#0071e3;--ok:#30d158;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#000;--panel:#1d1d1f;--text:#f5f5f7;--muted:#a1a1a6;--line:rgba(255,255,255,.14)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.bar a{color:var(--accent);font-size:14px;text-decoration:none}.bar b{font-size:17px}
h1{margin:32px 0 4px;text-align:center;font-size:clamp(30px,6vw,42px);letter-spacing:-.03em}
.sub{text-align:center;color:var(--muted);margin-bottom:24px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.info div{background:var(--panel);border-radius:18px;padding:12px;text-align:center}
.info small{display:block;color:var(--muted);font-size:12px}
.info b{font-size:22px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kartu{aspect-ratio:1;perspective:600px;border:none;background:none;cursor:pointer;font:inherit}
.in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.kartu.buka .in,.kartu.cocok .in{transform:rotateY(180deg)}
.sisi{position:absolute;inset:0;display:grid;place-items:center;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.depan{background:var(--panel);font-size:26px;color:var(--muted);border:1px solid var(--line)}
.belakang{background:var(--accent);transform:rotateY(180deg);font-size:clamp(30px,9vw,46px)}
.kartu.cocok .belakang{background:var(--ok)}
.kartu:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:20px}
.btn{display:block;margin:22px auto 0;font:inherit;font-size:16px;padding:12px 26px;border:none;border-radius:99px;background:var(--accent);color:#fff;cursor:pointer}
.btn:active{transform:scale(.97)}
.menang{margin-top:18px;text-align:center;font-weight:600;font-size:18px;min-height:28px}
footer{margin:48px 0 32px;text-align:center;font-size:12px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>
<body>
<header><div class="bar"><a href="01-porto (1).html">‹ Kembali ke Portofolio</a><b>Game JavaScript</b><span></span></div></header>
<main class="wrap">
  <h1>Game Memory</h1>
  <p class="sub">Cocokkan semua pasangan kartu dengan langkah sesedikit mungkin.</p>
  <div class="info">
    <div><small>Langkah</small><b id="langkah">0</b></div>
    <div><small>Waktu</small><b id="waktu">0s</b></div>
    <div><small>Rekor</small><b id="rekor">-</b></div>
  </div>
  <div class="board" id="board"></div>
  <p class="menang" id="menang" aria-live="polite"></p>
  <button class="btn" id="ulang" type="button">Main Lagi</button>
</main>
<footer>© 2026 Lufthi | Game JavaScript</footer>

<script>
const EMOJI=["⚽","🎮","🚀","🍕","🎧","🐱","🌈","🔥"];
const board=document.getElementById("board");
let kartuTerbuka=[],kunci=false,langkah=0,cocok=0,detik=0,timer=null;

function acak(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rekorTersimpan(){try{return Number(localStorage.getItem("rekorMemory"))||null}catch(e){return null}}
function tampilRekor(){const r=rekorTersimpan();document.getElementById("rekor").textContent=r?r:"-"}

function mulai(){
  clearInterval(timer);timer=null;
  kartuTerbuka=[];kunci=false;langkah=0;cocok=0;detik=0;
  document.getElementById("langkah").textContent=0;
  document.getElementById("waktu").textContent="0s";
  document.getElementById("menang").textContent="";
  board.innerHTML="";
  acak([...EMOJI,...EMOJI]).forEach(e=>{
    const b=document.createElement("button");
    b.type="button";b.className="kartu";b.dataset.e=e;b.setAttribute("aria-label","Kartu tertutup");
    b.innerHTML='<span class="in"><span class="sisi depan">?</span><span class="sisi belakang">'+e+'</span></span>';
    b.addEventListener("click",()=>balik(b));
    board.appendChild(b);
  });
  tampilRekor();
}

function balik(k){
  if(kunci||k.classList.contains("buka")||k.classList.contains("cocok"))return;
  if(!timer)timer=setInterval(()=>{detik++;document.getElementById("waktu").textContent=detik+"s"},1000);
  k.classList.add("buka");k.setAttribute("aria-label","Kartu "+k.dataset.e);
  kartuTerbuka.push(k);
  if(kartuTerbuka.length<2)return;

  langkah++;document.getElementById("langkah").textContent=langkah;
  const [a,b]=kartuTerbuka;
  if(a.dataset.e===b.dataset.e){
    [a,b].forEach(x=>{x.classList.remove("buka");x.classList.add("cocok")});
    kartuTerbuka=[];cocok++;
    if(cocok===EMOJI.length)selesai();
  }else{
    kunci=true;
    setTimeout(()=>{
      [a,b].forEach(x=>{x.classList.remove("buka");x.setAttribute("aria-label","Kartu tertutup")});
      kartuTerbuka=[];kunci=false;
    },800);
  }
}

function selesai(){
  clearInterval(timer);timer=null;
  const r=rekorTersimpan();
  let pesan="🎉 Selesai dalam "+langkah+" langkah, "+detik+" detik!";
  if(!r||langkah<r){try{localStorage.setItem("rekorMemory",langkah)}catch(e){}pesan+=" Rekor baru!";tampilRekor()}
  document.getElementById("menang").textContent=pesan.replace("dalu","dalam");
}

document.getElementById("ulang").addEventListener("click",mulai);
mulai();
</script>
</body>
</html>
