<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Login</title>

<!-- Tema dibagi dengan halaman lain (kunci "theme" yang sama) -->
<script>
(function(){
    var theme = null;
    try{ theme = localStorage.getItem("theme"); }catch(e){}
    var dark = theme ? theme === "dark"
                     : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if(dark) document.documentElement.classList.add("dark");
})();
</script>

<style>
/* =========================
   TOKEN WARNA & TIPOGRAFI
========================= */
:root{
    --bg:#ffffff;
    --panel:#f5f5f7;
    --input:#ffffff;
    --text:#1d1d1f;
    --muted:#6e6e73;
    --line:rgba(0,0,0,.1);
    --line-strong:rgba(0,0,0,.22);
    --accent:#0071e3;
    --accent-hover:#0077ed;
    --ok:#248a3d;
    --danger:#d70015;
    --shadow:0 10px 40px rgba(0,0,0,.14);
    --grad:linear-gradient(90deg,#0a84ff 0%,#5e5ce6 35%,#bf5af2 65%,#ff6482 100%);

    --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
           "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    color-scheme:light;
}

:root.dark{
    --bg:#000000;
    --panel:#1d1d1f;
    --input:#2c2c2e;
    --text:#f5f5f7;
    --muted:#a1a1a6;
    --line:rgba(255,255,255,.14);
    --line-strong:rgba(255,255,255,.26);
    --ok:#30d158;
    --danger:#ff453a;
    --shadow:0 10px 40px rgba(0,0,0,.7);

    color-scheme:dark;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:72px 20px 48px;
    font-family:var(--font);
    background:
        radial-gradient(60% 50% at 50% 0%, rgba(10,132,255,.14), rgba(10,132,255,0) 70%),
        radial-gradient(45% 40% at 90% 100%, rgba(191,90,242,.10), rgba(191,90,242,0) 70%),
        var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s, color .3s;
}

:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:8px;
}

.page{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}
.page > *{ animation:fadeUp .9s cubic-bezier(.22,1,.36,1) both; }
.page > :nth-child(2){ animation-delay:.08s; }
.page > :nth-child(3){ animation-delay:.16s; }
.page > :nth-child(4){ animation-delay:.28s; }
.page > :nth-child(5){ animation-delay:.4s; }

/* =========================
   TOMBOL TEMA
========================= */
#themeBtn{
    position:fixed;
    top:16px;
    right:16px;
    z-index:10;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border:none;
    border-radius:50%;
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    transition:background-color .2s;
}
#themeBtn:hover{ background:var(--line); }
#themeBtn .icon-sun{ display:none; }
:root.dark #themeBtn .icon-sun{ display:block; }
:root.dark #themeBtn .icon-moon{ display:none; }

/* =========================
   AVATAR
========================= */
.photo-wrap{
    position:relative;
    width:96px;
    height:96px;
}
.photo-wrap::before{
    content:"";
    position:absolute;
    inset:-12px;
    border-radius:50%;
    background:conic-gradient(from 0deg, #0a84ff, #bf5af2, #ff6482, #ff9f0a, #0a84ff);
    filter:blur(22px);
    opacity:.5;
    animation:spin 14s linear infinite;
}
.photo-wrap img{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--bg);
    transition:border-color .3s;
}

/* =========================
   JUDUL (efek mengetik)
========================= */
.headline{
    max-width:720px;
    margin-top:32px;
}
.headline h1{
    font-size:clamp(34px, 7vw, 60px);
    font-weight:700;
    line-height:1.08;
    letter-spacing:-.04em;
    background:var(--grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
}
.headline p{
    margin-top:14px;
    font-size:clamp(18px, 2.6vw, 24px);
    font-weight:500;
    color:var(--muted);
    letter-spacing:-.01em;
}
.huruf{
    opacity:0;
    transition:opacity .25s ease;
}
.huruf.on{ opacity:1; }

/* =========================
   KARTU LOGIN
========================= */
.card{
    width:min(400px, 100%);
    margin-top:40px;
    padding:32px 28px 28px;
    border-radius:32px;
    background:var(--panel);
    text-align:left;
    transition:background-color .3s;
}
.card.shake{ animation:shake .45s cubic-bezier(.36,.07,.19,.97); }

.card h2{
    margin-bottom:22px;
    text-align:center;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.03em;
}

.field{
    position:relative;
    margin-bottom:12px;
}
.field input{
    width:100%;
    height:58px;
    padding:22px 16px 6px;
    border:1px solid var(--line-strong);
    border-radius:14px;
    background:var(--input);
    color:var(--text);
    font:inherit;
    font-size:17px;
    transition:border-color .2s, box-shadow .2s, background-color .3s;
}
.field input.has-eye{ padding-right:52px; }
.field input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(0,113,227,.25);
}
.field input[aria-invalid="true"]{ border-color:var(--danger); }
.field input[aria-invalid="true"]:focus{ box-shadow:0 0 0 4px rgba(215,0,21,.2); }

.field label{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    font-size:17px;
    color:var(--muted);
    pointer-events:none;
    transition:top .18s ease, transform .18s ease, font-size .18s ease;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label,
.field input:-webkit-autofill + label{
    top:11px;
    transform:none;
    font-size:12px;
}

.eye{
    position:absolute;
    top:50%;
    right:8px;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border:none;
    border-radius:50%;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:background-color .2s, color .2s;
}
.eye:hover{ color:var(--text); background:var(--line); }
.eye .icon-hide{ display:none; }
.eye.shown .icon-show{ display:none; }
.eye.shown .icon-hide{ display:block; }

.btn{
    width:100%;
    height:52px;
    margin-top:8px;
    border:none;
    border-radius:980px;
    background:var(--accent);
    color:#fff;
    font:inherit;
    font-size:17px;
    font-weight:500;
    cursor:pointer;
    transition:background-color .2s, transform .2s, opacity .2s;
}
.btn:hover{ background:var(--accent-hover); }
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.6; cursor:default; transform:none; }

#pesan{
    min-height:24px;
    margin-top:16px;
    text-align:center;
    font-size:15px;
    font-weight:500;
}
#pesan.ok{ color:var(--ok); }
#pesan.err{ color:var(--danger); }

.copy{
    margin-top:28px;
    font-size:12px;
    color:var(--muted);
}

/* =========================
   ANIMASI
========================= */
@keyframes fadeUp{
    from{ opacity:0; transform:translateY(22px); }
    to{ opacity:1; transform:none; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes shake{
    10%, 90%{ transform:translateX(-2px); }
    20%, 80%{ transform:translateX(4px); }
    30%, 50%, 70%{ transform:translateX(-7px); }
    40%, 60%{ transform:translateX(7px); }
}

@media (max-width:480px){
    body{ padding-top:64px; }
    .card{ padding:28px 20px 24px; border-radius:28px; }
}

@media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>
<body>

<button id="themeBtn" type="button" onclick="toggleTheme()" aria-label="Ganti ke dark mode" title="Ganti ke dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<main class="page">

    <div class="photo-wrap">
        <img src="https://i.pinimg.com/1200x/3d/62/29/3d6229f18245536a8bec7d3ecade2243.jpg" alt="Foto Lufthi" referrerpolicy="no-referrer">
    </div>

    <div class="headline">
        <h1 id="typing1">Hallo Selamat Datang di Profile Lufthi</h1>
        <p id="typing2">Silakan Login Terlebih Dahulu !!!</p>
    </div>

    <form class="card" id="loginForm" novalidate>
        <h2>Login</h2>

        <div class="field">
            <input type="text" id="username" name="username" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false">
            <label for="username">Masukkan Username</label>
        </div>

        <div class="field">
            <input type="password" id="password" name="password" class="has-eye" placeholder=" " autocomplete="current-password">
            <label for="password">Masukkan Password</label>
            <button class="eye" id="eyeBtn" type="button" aria-label="Tampilkan password" title="Tampilkan password">
                <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
        </div>

        <button class="btn" id="loginBtn" type="submit">Masuk</button>

        <p id="pesan" role="status" aria-live="polite"></p>
    </form>

    <p class="copy">© 2026 Lufthi | Dashboard Portofolio</p>

</main>

<script>
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===== Tema (dibagi dengan halaman lain) ===== */
function applyTheme(isDark){
    document.documentElement.classList.toggle("dark", isDark);

    const btn = document.getElementById("themeBtn");
    const label = isDark ? "Ganti ke light mode" : "Ganti ke dark mode";
    btn.setAttribute("aria-label", label);
    btn.title = label;
}

function toggleTheme(){
    const isDark = !document.documentElement.classList.contains("dark");
    applyTheme(isDark);
    try{
        localStorage.setItem("theme", isDark ? "dark" : "light");
    }catch(e){}
}

applyTheme(document.documentElement.classList.contains("dark"));


/* ===== Efek mengetik (huruf muncul satu per satu, tata letak tidak bergeser) ===== */
function siapkanHuruf(el){
    const teks = el.textContent.trim();
    el.setAttribute("aria-label", teks);
    el.textContent = "";

    return Array.from(teks).map(h => {
        const span = document.createElement("span");
        span.className = "huruf";
        span.setAttribute("aria-hidden", "true");
        span.textContent = h;
        el.appendChild(span);
        return span;
    });
}

const hurufSemua = [
    ...siapkanHuruf(document.getElementById("typing1")),
    ...siapkanHuruf(document.getElementById("typing2"))
];

function ketik(){
    let i = 0;

    function lanjut(){
        if(i < hurufSemua.length){
            hurufSemua[i].classList.add("on");
            i++;
            setTimeout(lanjut, 55);
        }
    }
    lanjut();
}

if(reduceMotion){
    hurufSemua.forEach(h => h.classList.add("on"));
}else{
    setTimeout(ketik, 400);
}


/* ===== Tampil / sembunyikan password ===== */
const passwordInput = document.getElementById("password");
const eyeBtn = document.getElementById("eyeBtn");

eyeBtn.addEventListener("click", () => {
    const tampil = passwordInput.type === "password";

    passwordInput.type = tampil ? "text" : "password";
    eyeBtn.classList.toggle("shown", tampil);

    const label = tampil ? "Sembunyikan password" : "Tampilkan password";
    eyeBtn.setAttribute("aria-label", label);
    eyeBtn.title = label;
});


/* ===== Login ===== */
const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const usernameInput = document.getElementById("username");

form.addEventListener("submit", (e) => {
    e.preventDefault();   // mencegah refresh
    login();
});

[usernameInput, passwordInput].forEach(input => {
    input.addEventListener("input", () => {
        input.removeAttribute("aria-invalid");
    });
});

function login(){

    const user = usernameInput.value.trim();
    const pass = passwordInput.value;
    const pesan = document.getElementById("pesan");

    // Username dan password
    const usernameBenar = "Lufthi";
    const passwordBenar = "2712";

    if(user === usernameBenar && pass === passwordBenar){
        pesan.className = "ok";
        pesan.textContent = "Login berhasil!";
        loginBtn.disabled = true;

        // pindah halaman
        setTimeout(() => {
            window.location.href = "01-porto.html";
        }, 2000);

    }else{
        pesan.className = "err";
        pesan.textContent = "Username atau Password salah!";

        usernameInput.setAttribute("aria-invalid", "true");
        passwordInput.setAttribute("aria-invalid", "true");

        form.classList.remove("shake");
        void form.offsetWidth;
        form.classList.add("shake");
    }
}
</script>
</body>
</html>
